name: fear-nightfall
services:
  mc:
    image: itzg/minecraft-server:java17
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"
      DIFFICULTY: "hard"
      MOTD: "Fight On!"
      SEED: "-7343368139449600885"
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 6
      TYPE: "AUTO_CURSEFORGE"
      CF_SLUG: "fear-nightfall"
      CF_API_KEY: "${CF_API_KEY}"
      MODRINTH_PROJECTS: "chunky"
      CF_EXTRA_MODS_ALLOW_CURSEFORGE: "true"
    volumes:
      - ./data:/data
    restart: unless-stopped
