name: gregtech
services:
  mc:
    image: itzg/minecraft-server:java25
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "GTNH"
      GTNH_PACK_VERSION: "2.8.4"
      JVM_XX_OPTS: "-XX:+UseZGC -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+PerfDisableSharedMem"
      MEMORY: "8G"
      MAX_TICK_TIME: -1
      VIEW_DISTANCE: 8
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 120s
